<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voxel Model Railway</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1424; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 14px; top: 12px; z-index: 5;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #e6ded0; text-shadow: 0 1px 3px #000a; pointer-events: none;
    background: #0008; padding: 8px 11px; border-radius: 7px; max-width: 260px;
  }
  #hud b { color: #ffd08a; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #cbb; font: 14px ui-monospace, monospace; background: #0d1424;
  }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <b>Voxel Model Railway</b><br />
    Drag the two levers on the desk for <b>speed</b> and <b>time of day</b>.<br />
    Click the five buttons: lights, auto sun, turntable, traffic, whistle.<br />
    Keys: &uarr;/&darr; speed &nbsp; &larr;/&rarr; time &nbsp; 1&ndash;5 buttons.
  </div>
  <div id="loading">building the layout…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
