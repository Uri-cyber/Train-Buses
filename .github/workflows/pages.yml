name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/voxel-model-railway-qsar92]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tries to create the Pages site; where the Actions token may not, Pages
      # has to be switched on once by hand (Settings -> Pages -> Source:
      # GitHub Actions). Either way the build below still runs.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Chromium for the scene checks
        run: npx playwright install --with-deps chromium
      - name: Serve the build
        run: |
          npm run preview > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/ > /dev/null
      - name: Check the bundled network and the live scene
        run: npm run check
      - name: Check a network loaded through the OpenStreetMap path
        run: npm run test:live
      - name: Also produce the single-file build
        run: SINGLE=1 npm run build && cp dist-single/index.html dist/standalone.html
      - name: Remove the test fixture from the deployed site
        run: rm -rf dist/fixtures
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
