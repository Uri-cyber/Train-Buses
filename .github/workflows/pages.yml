name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/voxel-model-railway-qsar92]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the layout for clipping
        run: npm run check
      - name: Build
        run: npm run build
        env:
          BASE: ./
      - name: Also produce the single-file build
        run: SINGLE=1 npm run build && cp dist-single/index.html dist/standalone.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
