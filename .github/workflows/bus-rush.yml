name: Bus layer at a busy moment

# Counts the buses the proxy serves right now and renders the live site over central Tel Aviv,
# to judge whether the real-bus layer stays readable at rush hour.
on:
  workflow_dispatch:

permissions:
  contents: write          # the pictures are committed to docs/ so they can be looked at later

jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/bus-rush-check.mjs
      - name: Keep the pictures in docs/
        run: |
          mkdir -p docs && cp rush-close.jpg docs/buses-rush-close.jpg && cp rush-wide.jpg docs/buses-rush-wide.jpg
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/buses-rush-*.jpg
          git commit -m "Bus layer at a busy moment, $(date -u +%FT%H:%MZ) [skip ci]" || exit 0
          git push
