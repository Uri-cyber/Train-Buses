name: Probe the Israel Railways API

# Exploration only: GitHub's runners can reach the internet, the build
# machine that writes this project cannot. Run by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Does the API allow browsers on other sites (CORS)?
        run: |
          DAY=$(TZ=Asia/Jerusalem date +%Y-%m-%d); HOUR=$(TZ=Asia/Jerusalem date +%H:%M)
          KEY=5e64d66cf03f4547bcac5de2de06b566
          echo "== preflight from uri-cyber.github.io"
          curl -sS -m 25 -i -X OPTIONS -H 'origin: https://uri-cyber.github.io' -H 'access-control-request-method: POST' \
            -H 'access-control-request-headers: content-type,ocp-apim-subscription-key' \
            https://rail-api.rail.co.il/rjpa/api/v1/timetable/searchTrain | head -30
          echo; echo "== POST with that origin"
          curl -sS -m 25 -D - -o body.txt -X POST -H 'origin: https://uri-cyber.github.io' -H "ocp-apim-subscription-key: $KEY" -H 'content-type: application/json' \
            -d "{\"fromStation\":\"3700\",\"toStation\":\"2300\",\"date\":\"$DAY\",\"hour\":\"$HOUR\",\"scheduleType\":\"ByDeparture\",\"systemType\":\"2\",\"languageId\":\"Hebrew\"}" \
            https://rail-api.rail.co.il/rjpa/api/v1/timetable/searchTrain | head -30
          echo; echo "== trains with a live position right now"
          python3 - <<'PY'
          import json
          d=json.load(open('body.txt'))
          n=0
          for tv in d['result']['travels']:
            for t in tv['trains']:
              p=t.get('trainPosition')
              if p:
                n+=1
                if n<=6: print(t['trainNumber'], t['departureTime'], json.dumps(p, ensure_ascii=False))
          print('with position:', n, 'of', sum(len(tv['trains']) for tv in d['result']['travels']))
          PY
          echo; echo "== station list GET with browser origin"
          curl -sS -m 25 -D - -o /dev/null -H 'origin: https://uri-cyber.github.io' -H "ocp-apim-subscription-key: $KEY" \
            "https://rail-api.rail.co.il/common/api/v1/stations?languageId=Hebrew&systemType=2" | head -20
