name: Probe the Israel Railways API

# Exploration only: GitHub's runners can reach the internet, the build
# machine that writes this project cannot. Run by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Station ids and names
        run: |
          curl -sS -m 25 -H 'ocp-apim-subscription-key: 5e64d66cf03f4547bcac5de2de06b566' \
            "https://rail-api.rail.co.il/common/api/v1/stations?languageId=Hebrew&systemType=2" -o st.json
          python3 -c "
          import json; d=json.load(open('st.json'))
          for s in sorted(d['result'], key=lambda s: s['stationId']): print(s['stationId'], s['stationName'], round(s['location']['latitude'],3), round(s['location']['lontitude'],3))
          "
      - name: Live positions right now (no Origin header)
        run: |
          DAY=$(TZ=Asia/Jerusalem date +%Y-%m-%d); HOUR=$(TZ=Asia/Jerusalem date +%H:%M)
          for PAIR in "1600 7300" "680 3500" "1820 400"; do
            set -- $PAIR
            curl -sS -m 25 -o body.txt -X POST -H 'ocp-apim-subscription-key: 5e64d66cf03f4547bcac5de2de06b566' -H 'content-type: application/json' \
              -d "{\"fromStation\":\"$1\",\"toStation\":\"$2\",\"date\":\"$DAY\",\"hour\":\"$HOUR\",\"scheduleType\":\"ByDeparture\",\"systemType\":\"2\",\"languageId\":\"Hebrew\"}" \
              https://rail-api.rail.co.il/rjpa/api/v1/timetable/searchTrain
            echo "== $1 -> $2 ($(wc -c < body.txt) bytes)"
            python3 - <<'PY'
          import json
          try: d=json.load(open('body.txt'))
          except Exception: print(open('body.txt').read()[:300]); raise SystemExit
          if not d.get('result'): print(json.dumps(d)[:300]); raise SystemExit
          n=0; tot=0
          for tv in d['result']['travels']:
            for t in tv['trains']:
              tot+=1; p=t.get('trainPosition')
              if p:
                n+=1
                if n<=5: print(t['trainNumber'], t['departureTime'][11:16], '->', t['arrivalTime'][11:16], json.dumps(p, ensure_ascii=False))
          print('with position:', n, 'of', tot, 'trains;', len(d['result']['travels']), 'journeys')
          PY
          done
      - uses: actions/checkout@v4
      - name: Run the proxy (worker/rail-live.js) once, as the page would use it
        run: |
          node --input-type=module -e "
          import worker from './worker/rail-live.js';
          let trains = [], r, d;
          for (let i = 0; i < 6; i++) {
            const t0 = Date.now();
            r = await worker.fetch(new Request('https://example.workers.dev/live'));
            d = await r.json();
            trains = Object.values(d.trains || {});
            console.log('call', i + 1, 'HTTP', r.status, 'in', Date.now() - t0, 'ms; pairs', JSON.stringify(d.pairs), ';', trains.length, 'trains;', trains.filter((t) => t.delay !== null).length, 'with a live position;', trains.filter((t) => t.delay > 0).length, 'late');
            if (d.pairs && d.pairs.fresh >= d.pairs.total) break;
          }
          console.log(JSON.stringify(trains.filter((t) => t.delay !== null).slice(0, 2)));
          if (r.status !== 200 || trains.length < 100) process.exit(1);
          "
      - name: The deployed proxy the page uses
        run: |
          URL=$(grep -oE "const LIVE_URL = '[^']+'" src/main.js | cut -d"'" -f2)
          echo "$URL"
          curl -sS -m 40 -D - -o live.json -H 'origin: https://uri-cyber.github.io' "$URL" | head -12
          node -e "const d=require('./live.json'); const t=Object.values(d.trains||{}); console.log('trains', t.length, 'positioned', t.filter(x=>x.delay!==null).length, 'late', t.filter(x=>x.delay>0).length, 'age s', Math.round((Date.now()-d.fetched)/1000))"
