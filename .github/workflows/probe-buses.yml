name: Probe the Open Bus API

# One-off look at Hasadna's Open Bus Stride API (MOT SIRI bus positions, re-published openly):
# how fresh the positions are, how many buses a short window holds, how big that answer is,
# and whether a browser on another site may read it.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: The parameters the list endpoint takes, and the snapshot endpoints
        run: |
          API=https://open-bus-stride-api.hasadna.org.il
          curl -sS -m 60 "$API/openapi.json" -o api.json -w 'openapi %{http_code} %{size_download}\n'
          node -e "const a=require('./api.json'); console.log(Object.keys(a.paths).filter(p=>/siri/.test(p)).join('\n')); console.log('vehicle_locations params:', a.paths['/siri_vehicle_locations/list'].get.parameters.map(x=>x.name).join(', ')); console.log('snapshots params:', (a.paths['/siri_snapshots/list']?.get.parameters||[]).map(x=>x.name).join(', '))"
      - name: How fresh is the newest snapshot
        run: |
          API=https://open-bus-stride-api.hasadna.org.il
          echo "now UTC: $(date -u +%FT%TZ)"
          curl -sS -m 60 "$API/siri_snapshots/list?limit=5&order_by=id%20desc" -o snaps.json -w 'snapshots %{http_code}\n'
          node -e "for (const s of require('./snaps.json')) console.log(JSON.stringify(s))"
      - name: Buses recorded in the last few minutes
        run: |
          API=https://open-bus-stride-api.hasadna.org.il
          for MIN in 2 5 15; do
            FROM=$(date -u -d "-$MIN min" +%FT%TZ); TO=$(date -u -d "+2 min" +%FT%TZ)
            curl -sS -m 120 -o w.json "$API/siri_vehicle_locations/list?limit=50000&recorded_at_time_from=$FROM&recorded_at_time_to=$TO" -w "last ${MIN}m: HTTP %{http_code} %{size_download} bytes %{time_total}s\n"
            node -e "const a=require('./w.json'); if(!Array.isArray(a)){console.log('  not a list:', JSON.stringify(a).slice(0,300)); process.exit(0)}
              const veh=new Set(a.map(r=>r.siri_ride__vehicle_ref)); const t=a.map(r=>r.recorded_at_time).sort();
              console.log('  rows', a.length, '| vehicles', veh.size, '| oldest', t[0], '| newest', t[t.length-1], '| moving', a.filter(r=>r.velocity>0).length)"
          done
